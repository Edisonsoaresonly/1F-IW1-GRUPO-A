<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Angeles Lakers - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
      padding: 20px;
    }

    .card-container {
      width: 100%;
      max-width: 950px;
      background-color: #552583;
      color: #FDB927;
      border-radius: 25px;
      padding: 30px 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .nav-left, .nav-right {
      display: flex;
      gap: 30px;
    }

    .navbar a {
      color: #FDB927;
      text-decoration: underline;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    main {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .left-section {
      flex: 1.3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
      line-height: 1.1;
      font-weight: bold;
    }

    .subtitle {
      font-size: 0.95rem;
      font-family: sans-serif;
      font-weight: 600;
      max-width: 420px;
      line-height: 1.3;
    }

    .image-frame {
      width: 100%;
      max-width: 420px;
      height: 220px;
      border-radius: 20px;
      padding: 12px;
      margin-top: 15px;
      border: 2px solid #3c1960;
      background-color: #481e72;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .right-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-card {
      width: 110%;
      max-width: 500px;
      height: 500px;
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background-color: #481e72;
      box-shadow: -10px 10px 0px #38165b;
    }

    .logo-card img {
      width: 110%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <header class="navbar">
      <nav class="nav-left">
        <a href="index.html" class="active">HOME</a>
        <a href="sobre.html">SOBRE A FRANQUIA</a>
      </nav>
      <nav class="nav-right">
        <a href="#">CADASTRO / LOGIN</a>
      </nav>
    </header>

    <main>
      <section class="left-section">
        <h1>LOS ANGELES LAKERS</h1>
        <p class="subtitle">O legado do Mamba vive em cada jogo, em cada arremesso, em cada torcedor laker.</p>
        
        <div class="image-frame">
          <img src="Imagem.jpg" alt="Jogo dos Lakers na quadra">
        </div>
      </section>

      <section class="right-section">
        <div class="logo-card">
          <img src="escudo.jpg"Logo Los Angeles Lakers">
        </div>
      </section>
    </main>
  </div>
</body>
</html>
